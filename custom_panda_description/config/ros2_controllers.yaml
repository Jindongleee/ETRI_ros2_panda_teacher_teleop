controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Controllers list
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

# Joint State Broadcaster
joint_state_broadcaster:
  ros__parameters:
    extra_joints: []

# Panda Arm Controller
panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# Robotiq Gripper Controller
robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_left_outer_knuckle_joint
    
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 235.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
