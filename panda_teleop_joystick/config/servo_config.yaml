# =============================================================================
# MoveIt Servo 설정 (Joystick 텔레오퍼레이션용)
# joy_to_twist_node → /servo_node/delta_twist_cmds → Servo(IK) → joint_trajectory
# =============================================================================
/**:
  ros__parameters:
    # ROS2 파라미터 네임스페이스 (이 계층이 반드시 있어야 servo_node가 인식함)
    moveit_servo:
      # Gazebo 시뮬레이션 사용 여부 (false = RViz/실제 로봇)
      use_gazebo: false
      # 입력 명령 단위: "speed_units" = 선속도/각속도 (TwistStamped)
      command_in_type: "speed_units"

      # Servo 내부에서 입력에 곱하는 스케일 (1.0 = joy_to_twist_node 쪽 스케일만 사용)
      scale:
        linear: 1.0   # 선속도 스케일
        rotational: 1.0  # 각속도 스케일
        joint: 1.0    # 조인트 속도 스케일 (joint_command 사용 시)

      # Servo 제어 주기 (0.01초 = 100 Hz)
      publish_period: 0.01
      # 저지연 모드 (true 시 publish_period 무시하고 가능한 한 빠르게 동작)
      low_latency_mode: false
      # 로우 패스 필터 계수 (출력 스무딩, 값이 클수록 덜 스무딩)
      low_pass_filter_coeff: 1.1

      # MoveIt 모션 그룹/프레임 이름 (URDF/SRDF와 일치해야 함)
      move_group_name: "panda_arm"       # 팔 모션 그룹
      planning_frame: "panda_link0"     # 계획 기준 프레임 (로봇 베이스)
      ee_frame_name: "gripper_tip_link" # 엔드이펙터 프레임 (Twist 기준)
      robot_link_command_frame: "panda_link0"  # 명령 해석 기준 프레임

      # 입력이 이 시간(초) 동안 없으면 자동 정지
      incoming_command_timeout: 0.5
      # 정지 시 보낼 halt 메시지 개수 (서보가 확실히 멈추도록)
      num_outgoing_halt_msgs_to_publish: 4

      # 특이점(Singularity) 감지: Jacobian 조건수 기준
      lower_singularity_threshold: 10.0   # 이 값 넘으면 속도 감소
      hard_stop_singularity_threshold: 20.0  # 이 값 넘으면 즉시 정지
      joint_limit_margin: 0.01  # 조인트 한계까지 남겨둘 여유(rad)

      # 충돌 검사 (필수 파라미터: collision_check_rate > 0)
      check_collisions: false
      collision_check_rate: 50.0  # Hz
      self_collision_proximity_threshold: 100.0   # 자체 충돌 거리 임계(mm)
      scene_collision_proximity_threshold: 100.0   # 장면 충돌 거리 임계(mm)

      # 토픽 이름 (~/ 는 노드 네임스페이스로 치환됨)
      cartesian_command_in_topic: "~/delta_twist_cmds"   # TwistStamped 입력
      joint_command_in_topic: "~/delta_joint_cmds"       # 조인트 속도 입력(미사용 시 무시)
      command_out_topic: "/panda_arm_controller/joint_trajectory"  # 출력 궤적
      command_out_type: "trajectory_msgs/JointTrajectory"

      # 출력 궤적에 포함할 데이터
      publish_joint_positions: true
      publish_joint_velocities: true
      publish_joint_accelerations: false

      # 스무딩 필터 플러그인 (MoveIt 2 기본 권장)
      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
      override_velocity_scaling_factor: 1.0   # 궤적 속도 스케일 (0~1)
      override_acceleration_scaling_factor: 1.0  # 궤적 가속도 스케일 (0~1)

      # Planning scene을 이 노드가 주도할지 여부 (다중 Servo 시 하나만 true)
      is_primary_planning_scene_monitor: true
